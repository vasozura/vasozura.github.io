<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source 33 Learning artifacts</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;background:#101318;color:#eef}table{width:100%;border-collapse:collapse}th,td{padding:.7rem;border-bottom:1px solid #39404d;text-align:left}a{color:#78d5ff}button{padding:.45rem .7rem}.ok{color:#7ee787}.off{color:#aaa}</style></head>
<body><h1>Source 33 — reviewed Learning artifacts</h1><p>Local review only. Original behavior is preserved; Melody is a static reviewed MIDI; Full Song is explicitly unavailable.</p><table><thead><tr><th>Instrument</th><th>Original</th><th>Melody</th><th>Full Song</th></tr></thead><tbody id="rows"></tbody></table><p id="status">Loading manifest…</p>
<script type="module">const m=await fetch('./learning-artifacts.json').then(r=>{if(!r.ok)throw Error(`Manifest ${r.status}`);return r.json()});const rows=document.querySelector('#rows');for(const name of ['piano','guitar','accordion']){const tr=document.createElement('tr');tr.innerHTML=`<th>${name[0].toUpperCase()+name.slice(1)}</th>${['original','melody','fullSong'].map(mode=>{const a=m.instruments[name][mode];const body=a.strategy==='existing-learning-source'?'Current Learning source':a.available?`<a href="${a.url}">${mode}</a>`:`${mode} — unavailable`;return `<td class="${a.available?'ok':'off'}">${body}</td>`}).join('')}`;rows.append(tr)}document.querySelector('#status').textContent=`PASS · ${m.midiIdentity.noteCount} notes · ${m.midiIdentity.durationSeconds.toFixed(3)} s · source ${m.song.slug}`;</script></body></html>
